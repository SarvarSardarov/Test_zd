name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Тестовые значения для .env — только для CI, не боевые пароли
  MYSQL_ROOT_PASSWORD: ci_test_root_pass
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wpuser
  MYSQL_PASSWORD: ci_test_wp_pass

jobs:
  validate_compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
          echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
          echo "MYSQL_USER=$MYSQL_USER" >> .env
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env

      - name: Validate compose file
        run: docker compose config

  test_containers_up:
    name: Test containers start correctly
    runs-on: ubuntu-latest
    needs: validate_compose
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
          echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
          echo "MYSQL_USER=$MYSQL_USER" >> .env
          echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env

      - name: Start containers
        run: docker compose up -d

      - name: Wait for containers to initialize
        run: sleep 20

      - name: Show containers status
        run: docker compose ps

      - name: Check for failed containers
        run: |
          if docker compose ps --status exited | grep -q .; then
            echo "Есть упавшие контейнеры!"
            docker compose logs
            exit 1
          fi
          echo "Все контейнеры успешно запущены"

      - name: Tear down containers
        if: always()
        run: docker compose down -v
