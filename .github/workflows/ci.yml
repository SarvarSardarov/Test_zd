stages:
  - validate
  - test

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  # Тестовые значения для .env — только для CI, не боевые пароли
  MYSQL_ROOT_PASSWORD: ci_test_root_pass
  MYSQL_DATABASE: wordpress
  MYSQL_USER: wpuser
  MYSQL_PASSWORD: ci_test_wp_pass

# Проверка синтаксиса docker-compose.yml
validate_compose:
  stage: validate
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-compose-plugin || true
  script:
    - echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
    - echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
    - echo "MYSQL_USER=$MYSQL_USER" >> .env
    - echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env
    - docker compose config
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Пробный запуск всех контейнеров — проверка, что стек реально поднимается
test_containers_up:
  stage: test
  image: docker:24-cli
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache docker-compose-plugin curl || true
  script:
    - echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
    - echo "MYSQL_DATABASE=$MYSQL_DATABASE" >> .env
    - echo "MYSQL_USER=$MYSQL_USER" >> .env
    - echo "MYSQL_PASSWORD=$MYSQL_PASSWORD" >> .env
    - docker compose up -d
    - sleep 20
    - docker compose ps
    # Проверяем, что все контейнеры в статусе running, иначе падаем с ошибкой
    - |
      if docker compose ps --status exited | grep -q .; then
        echo "Есть упавшие контейнеры!"
        docker compose logs
        exit 1
      fi
    - echo "Все контейнеры успешно запущены"
  after_script:
    - docker compose down -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
