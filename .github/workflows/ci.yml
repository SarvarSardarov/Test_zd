name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Тестовые значения для .env — только для CI, не боевые пароли
  # Имена соответствуют переменным, которые ожидает docker-compose.yml
  BD_root: ci_test_root_pass
  BD_bd: wordpress
  BD_us: wpuser
  BD_pass: ci_test_wp_pass

jobs:
  validate_compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "BD_root=$BD_root" > .env
          echo "BD_bd=$BD_bd" >> .env
          echo "BD_us=$BD_us" >> .env
          echo "BD_pass=$BD_pass" >> .env

      - name: Validate compose file
        run: docker compose config

  test_containers_up:
    name: Test containers start correctly
    runs-on: ubuntu-latest
    needs: validate_compose
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "BD_root=$BD_root" > .env
          echo "BD_bd=$BD_bd" >> .env
          echo "BD_us=$BD_us" >> .env
          echo "BD_pass=$BD_pass" >> .env

      - name: Start containers
        run: docker compose up -d

      - name: Wait for containers to initialize
        run: sleep 20

      - name: Show containers status
        run: docker compose ps

      - name: Check for failed containers
        run: |
          FAILED=$(docker compose ps --status exited --format "{{.Name}}")
          if [ -n "$FAILED" ]; then
            echo "Есть упавшие контейнеры: $FAILED"
            docker compose logs
            exit 1
          fi
          echo "Все контейнеры успешно запущены"

      - name: Tear down containers
        if: always()
        run: docker compose down -v
